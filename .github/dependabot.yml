version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/gateway-web
    schedule:
      interval: weekly
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      next-lint:
        patterns: [next, eslint, eslint-config-next, '@next/eslint-plugin-next']
  - package-ecosystem: npm
    directory: /services/mcp-server
    schedule:
      interval: weekly
    groups:
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*', zod]
  - package-ecosystem: npm
    directory: /scripts/complexity
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /infra/caddy
      - /apps/gateway-web
      - /services/catalog-service
      - /services/content-service
      - /services/amendment-service
      - /services/identity-service
      - /services/editor-service
      - /services/audit-service
      - /services/ingestion-service
      - /services/search-service
      - /services/document-service
      - /services/mcp-server
      - /infra/local-stack
    schedule:
      interval: weekly
    groups:
      node-runtime:
        patterns: [node]
      java-runtime:
        patterns: [eclipse-temurin]
  - package-ecosystem: gradle
    # One entry groups the shared platform and its consumers in the same PR.
    directories:
      - /
      - /services/catalog-service
      - /services/content-service
      - /services/amendment-service
      - /services/identity-service
      - /services/editor-service
      - /services/audit-service
      - /services/ingestion-service
      - /services/search-service
      - /services/document-service
      - /services/platform
    schedule:
      interval: weekly
    groups:
      backend-framework:
        patterns:
          - org.springframework.boot
          - 'org.springframework.boot:*'
          - 'org.jetbrains.kotlin*'
          - jvm
          - plugin.spring
          - 'org.springdoc:*'
          - 'com.fasterxml.jackson*'
          - 'tools.jackson*'
          - 'org.testcontainers:*'
      spotless:
        patterns: ['*spotless*']
