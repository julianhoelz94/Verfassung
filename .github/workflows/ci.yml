name: CI

on:
  push:
  pull_request:

# Least privilege for the default GITHUB_TOKEN; no job needs write access.
permissions:
  contents: read

jobs:
  backend-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        name: List microservices
        run: |
          set -euo pipefail
          services='[]'
          for dir in services/*/; do
            if [ -f "${dir}build.gradle.kts" ] && [ -f "${dir}gradlew" ] && [ -f "${dir}Dockerfile" ]; then
              name="$(basename "$dir")"
              services="$(jq -cn --argjson acc "$services" --arg name "$name" '$acc + [$name]')"
            fi
          done
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Microservices: $services"

  backend:
    needs: backend-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew check

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check platform
        run: ./gradlew -p services/platform check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: |
          cd apps/gateway-web
          npm ci
          npm test
          npm run lint
          npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright journeys including all login roles
        run: npm run test:e2e
        env:
          CI: true
          E2E_SKIP_VISUAL: true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/gateway-web/playwright-report
            apps/gateway-web/test-results
          retention-days: 7

  visual-e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.51.1-jammy
    defaults:
      run:
        working-directory: apps/gateway-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test e2e/visual.spec.ts
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-report
          path: |
            apps/gateway-web/playwright-report
            apps/gateway-web/test-results
          retention-days: 7

  images:
    needs: backend-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: BootJar ${{ matrix.service }}
        run: ./gradlew -p services/${{ matrix.service }} bootJar -x test
      - name: Build ${{ matrix.service }} image
        run: docker build -t constitution-atlas/${{ matrix.service }}:ci services/${{ matrix.service }}

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t constitution-atlas/gateway-web:ci apps/gateway-web
      - run: docker build -t constitution-atlas/edge-proxy:ci infra/caddy

  publish-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: publish-journey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: BootJar journey services
        run: |
          set -euo pipefail
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service; do
            ./gradlew -p "services/${service}" bootJar -x test
          done
      - name: Compose identity catalog content editor
        run: |
          set -euo pipefail
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            up -d --build editor-service
      - name: ED-4 publish keeps source version bytes
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source env/ci.env.example
          set +a
          python3 scripts/publish_journey.py
      - name: Journey logs
        if: failure()
        run: |
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            logs --no-color --tail=200
      - name: Stop journey stack
        if: always()
        run: |
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            down -v

  full-stack-service-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build service artifacts on one runner
        run: |
          set -euo pipefail
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service ingestion-service; do
            ./gradlew -p "services/${service}" bootJar -x test
            test -f "services/${service}/build/libs/app.jar"
          done
          tar -cf full-stack-service-jars.tar services/*/build/libs/app.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-stack-service-jars
          path: full-stack-service-jars.tar
          if-no-files-found: error
          compression-level: 0

  full-stack-e2e:
    needs: full-stack-service-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COMPOSE_PROJECT_NAME: full-stack-e2e
      CADDY_PORT: '18080'
      GATEWAY_PORT: '13000'
      SESSION_COOKIE_SECURE: 'false'
      PUBLIC_BASE_URL: http://127.0.0.1:18080
      PREPOPULATE_TEST_STACK: 'true'
      PREPOPULATE_BASE_URL: http://127.0.0.1:18080
      E2E_BASE_URL: http://127.0.0.1:18080
      CI_ADMIN_EMAIL: ci-admin@example.local
      CI_ADMIN_PASSWORD: change-me
      CI_VIEWER_EMAIL: ci-viewer@example.local
      CI_VIEWER_PASSWORD: change-me
      IDENTITY_SEED_TOTP_SECRET: CAATLASMFASEED22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: full-stack-service-jars
          path: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install browser dependencies
        working-directory: apps/gateway-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify transferred service artifacts
        run: |
          set -euo pipefail
          tar -xf full-stack-service-jars.tar
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service ingestion-service; do
            test -s "services/${service}/build/libs/app.jar"
          done
      - name: Start production stack
        run: |
          docker compose --env-file env/ci.env.example up -d --build edge-proxy
          for attempt in $(seq 1 90); do
            ready=true
            for service in catalog content amendment identity ingestion search; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:18080/api/${service}/actuator/health" || true)
              if [ "$status" != 200 ]; then ready=false; break; fi
            done
            if [ "$ready" = true ] && curl --fail --silent http://127.0.0.1:18080/about >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file env/ci.env.example ps
          exit 1
      - name: Generate, upload, and verify API fixtures
        working-directory: apps/gateway-web
        run: |
          npm run fixtures:generate
          git diff --exit-code -- e2e/fixtures/generated
          npm run prepopulate
          cp e2e/fixtures/generated/.runtime/prepopulate-ids.json /tmp/prepopulate-first-ids.json
          npm run prepopulate
          cmp /tmp/prepopulate-first-ids.json e2e/fixtures/generated/.runtime/prepopulate-ids.json
          npm run prepopulate -- --verify-only
      - name: Full-stack browser journeys
        working-directory: apps/gateway-web
        run: npm run test:e2e:full
      - name: Stack logs
        if: failure()
        run: docker compose --env-file env/ci.env.example logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose --env-file env/ci.env.example down -v
