name: CI

on:
  push:
  pull_request:

# Least privilege for the default GITHUB_TOKEN; no job needs write access.
permissions:
  contents: read

jobs:
  backend-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        name: List microservices
        run: |
          set -euo pipefail
          services='[]'
          for dir in services/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              name="$(basename "$dir")"
              services="$(jq -cn --argjson acc "$services" --arg name "$name" '$acc + [$name]')"
            fi
          done
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Microservices: $services"

  backend:
    needs: backend-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: |
          cd apps/gateway-web
          npm ci
          npm test
          npm run lint
          npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/gateway-web/playwright-report
            apps/gateway-web/test-results
          retention-days: 7

  images:
    needs: backend-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: BootJar ${{ matrix.service }}
        run: ./gradlew -p services/${{ matrix.service }} bootJar -x test
      - name: Build ${{ matrix.service }} image
        run: docker build -t constitution-atlas/${{ matrix.service }}:ci services/${{ matrix.service }}

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t constitution-atlas/gateway-web:ci apps/gateway-web
      - run: docker build -t constitution-atlas/edge-proxy:ci infra/caddy

  publish-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: publish-journey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: BootJar journey services
        run: |
          set -euo pipefail
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service; do
            ./gradlew -p "services/${service}" bootJar -x test
          done
      - name: Compose identity catalog content editor
        run: |
          set -euo pipefail
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            up -d --build editor-service
      - name: ED-4 publish keeps source version bytes
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source env/ci.env.example
          set +a
          python3 scripts/publish_journey.py
      - name: Journey logs
        if: failure()
        run: |
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            logs --no-color --tail=200
      - name: Stop journey stack
        if: always()
        run: |
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            down -v
