name: CI

on:
  push:
  pull_request:

jobs:
  backend-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: List microservices
        run: |
          set -euo pipefail
          services='[]'
          for dir in services/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              name="$(basename "$dir")"
              services="$(jq -cn --argjson acc "$services" --arg name "$name" '$acc + [$name]')"
            fi
          done
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Microservices: $services"

  backend:
    needs: backend-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: gradle test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd apps/gateway-web
          npm ci
          npm run lint
          npm run build
