name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the default GITHUB_TOKEN; no job needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local-stack orchestration
        run: |
          bash -n manageLocalStack.sh
          python3 scripts/test_local_stack.py
      - name: Check manual deployment safeguards and runtime definition
        run: |
          python3 -m venv "$RUNNER_TEMP/cd-checks"
          "$RUNNER_TEMP/cd-checks/bin/python" -m pip install PyYAML==6.0.2
          "$RUNNER_TEMP/cd-checks/bin/python" -m unittest discover -s scripts/cd -p 'test_*.py'
          "$RUNNER_TEMP/cd-checks/bin/python" scripts/cd/render_compose.py --check
      - id: list
        name: List microservices
        run: |
          set -euo pipefail
          services='[]'
          for dir in services/*/; do
            if [ -f "${dir}build.gradle.kts" ] && [ -f "${dir}gradlew" ] && [ -f "${dir}Dockerfile" ]; then
              name="$(basename "$dir")"
              services="$(jq -cn --argjson acc "$services" --arg name "$name" '$acc + [$name]')"
            fi
          done
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Microservices: $services"

  backend:
    needs: backend-services
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p build
          ./gradlew check 2>&1 | tee build/ci-check.log
      - name: Bundle JVM coverage
        if: always()
        run: python3 scripts/code_coverage/coverage_report.py pack jvm-${{ matrix.service }} --format jvm
      - name: Upload JVM coverage input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: coverage-input-${{ matrix.service }}
          path: coverage/inputs/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed ${{ matrix.service }} reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.service }}-reports
          path: |
            services/${{ matrix.service }}/build/ci-check.log
            services/${{ matrix.service }}/build/reports/tests
            services/${{ matrix.service }}/build/test-results
            services/${{ matrix.service }}/build/reports/problems
          if-no-files-found: ignore
          retention-days: 7

  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check platform
        run: |
          set -euo pipefail
          mkdir -p services/platform/build
          ./gradlew -p services/platform check 2>&1 | tee services/platform/build/ci-check.log
      - name: Bundle platform coverage
        if: always()
        run: python3 scripts/code_coverage/coverage_report.py pack jvm-platform --format jvm
      - name: Upload platform coverage input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: coverage-input-platform
          path: coverage/inputs/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed platform reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-reports
          path: |
            services/platform/build/ci-check.log
            services/platform/build/reports/tests
            services/platform/build/test-results
            services/platform/build/reports/problems
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check repository hygiene, restore preflight and Wiki references
        run: |
          python3 scripts/check-repository-hygiene.py
          python3 scripts/test_backup_restore.py
          python3 -m unittest discover -s scripts/operations -p 'test_*.py'
          python3 scripts/check-wiki-docs.py
      - name: Install gateway dependencies
        working-directory: apps/gateway-web
        run: npm ci
      - name: Audit gateway production dependencies
        working-directory: apps/gateway-web
        run: npm audit --omit=dev --audit-level=high
      - name: Reject generated fixture drift
        working-directory: apps/gateway-web
        run: |
          find e2e/fixtures/generated -maxdepth 1 -type f -name '*.json' -delete
          npm run fixtures:generate
          git diff --exit-code -- e2e/fixtures/generated
          untracked_generated="$(git ls-files --others --exclude-standard -- e2e/fixtures/generated)"
          if [ -n "$untracked_generated" ]; then
            echo "$untracked_generated"
            exit 1
          fi
      - name: Test, lint, and build gateway
        working-directory: apps/gateway-web
        run: |
          npm run test:coverage
          npm run typecheck
          npm run lint
          npm run build

      - name: Bundle gateway coverage
        if: always()
        run: |
          python3 scripts/code_coverage/coverage_report.py pack gateway-typescript --format istanbul --report apps/gateway-web/coverage/vitest/coverage-final.json
          python3 scripts/code_coverage/coverage_report.py pack gateway-javascript --format istanbul --report apps/gateway-web/coverage/node/coverage-final.json
      - name: Upload gateway coverage input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: coverage-input-gateway
          path: coverage/inputs/
          if-no-files-found: error
          retention-days: 14

  e2e:
    # Match the OS supported by the pinned Playwright browser installer.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gateway-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright journeys including all login roles
        run: npm run test:e2e
        env:
          CI: true
          E2E_SKIP_VISUAL: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/gateway-web/test-results/**/*.png
            apps/gateway-web/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  visual-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    defaults:
      run:
        working-directory: apps/gateway-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run build
      - run: npx playwright test e2e/visual.spec.ts e2e/ui-review.spec.ts e2e/country-directory.spec.ts
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-visual-report
          path: |
            apps/gateway-web/test-results/**/*.png
            apps/gateway-web/test-results/**/error-context.md
            !apps/gateway-web/test-results/*-retry*/**
          if-no-files-found: ignore
          retention-days: 7

  images:
    needs: backend-services
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.backend-services.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: BootJar ${{ matrix.service }}
        run: ./gradlew -p services/${{ matrix.service }} bootJar -x test
      - name: Build ${{ matrix.service }} image
        run: docker build -t constitution-atlas/${{ matrix.service }}:ci services/${{ matrix.service }}
      - name: Verify local Identity source image and language registry
        if: matrix.service == 'identity-service'
        run: docker build -f infra/local-stack/Dockerfile --build-arg SERVICE=identity-service -t constitution-atlas/identity-service:local-ci .

  gateway-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t constitution-atlas/gateway-web:ci apps/gateway-web
      - run: docker build -t constitution-atlas/edge-proxy:ci infra/caddy
      - name: Validate transport modes and policy
        run: |
          python3 -m venv "$RUNNER_TEMP/transport-coverage"
          "$RUNNER_TEMP/transport-coverage/bin/pip" install coverage==7.17.0
          python3 -m unittest discover -s infra/caddy -p 'test_*.py'
          "$RUNNER_TEMP/transport-coverage/bin/python" -m coverage run --parallel-mode scripts/check-transport-configs.py
          python3 scripts/test-local-https.py
          python3 scripts/test-acme-http01.py
          python3 scripts/test-proxy-https.py
          python3 scripts/test-proxy-https.py --docs-enabled

      - name: Upload transport execution coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: python-transport-execution
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  mcp-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install MCP dependencies
        working-directory: services/mcp-server
        run: npm ci
      - name: Audit MCP production dependencies
        working-directory: services/mcp-server
        run: npm audit --omit=dev --audit-level=high
      - name: Verify MCP tools
        working-directory: services/mcp-server
        run: npm run test:coverage
      - name: Bundle MCP coverage
        if: always()
        run: python3 scripts/code_coverage/coverage_report.py pack mcp --format istanbul --report services/mcp-server/coverage/coverage-final.json
      - name: Upload MCP coverage input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: coverage-input-mcp
          path: coverage/inputs/
          if-no-files-found: error
          retention-days: 14
      - run: docker build -t constitution-atlas/mcp-server:ci services/mcp-server

  publish-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: publish-journey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: BootJar journey services
        run: |
          set -euo pipefail
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service document-service; do
            ./gradlew --no-daemon -p "services/${service}" bootJar -x test 2>&1 | tee -a publish-journey-build.txt
          done
      - name: Compose identity catalog content editor
        run: |
          set -euo pipefail
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            up -d --build editor-service 2>&1 | tee publish-journey-compose.txt
      - name: ED-4 publish keeps source version bytes
        run: |
          python3 -m venv "$RUNNER_TEMP/publication-coverage"
          "$RUNNER_TEMP/publication-coverage/bin/pip" install coverage==7.17.0
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source env/ci.env.example
          set +a
          "$RUNNER_TEMP/publication-coverage/bin/python" -m coverage run --parallel-mode scripts/publish_journey.py 2>&1 | tee publish-journey-output.txt
      - name: Upload publication execution coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: python-publication-execution
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Journey logs
        if: failure()
        run: |
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            logs --no-color --tail=200 > publish-journey-logs.txt
          cat publish-journey-logs.txt
      - name: Upload failed publish journey diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-journey-diagnostics
          path: |
            publish-journey-build.txt
            publish-journey-compose.txt
            publish-journey-output.txt
            publish-journey-logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop journey stack
        if: always()
        run: |
          docker compose --env-file env/ci.env.example \
            -f docker-compose.yml -f docker-compose.publish-journey.yml \
            down -v

  full-stack-service-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build service artifacts on one runner
        run: |
          set -euo pipefail
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service ingestion-service document-service; do
            ./gradlew --no-daemon -p "services/${service}" bootJar -x test
            test -f "services/${service}/build/libs/app.jar"
          done
          tar -cf full-stack-service-jars.tar services/*/build/libs/app.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-stack-service-jars
          path: full-stack-service-jars.tar
          if-no-files-found: error
          compression-level: 0

  full-stack-e2e:
    needs: full-stack-service-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      COMPOSE_PROJECT_NAME: full-stack-e2e
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      CADDY_PORT: '18080'
      GATEWAY_PORT: '13000'
      SESSION_COOKIE_SECURE: 'false'
      SETUP_FIXTURE_COMPLETE: 'false'
      PUBLIC_BASE_URL: http://localhost:18080
      PREPOPULATE_TEST_STACK: 'true'
      PREPOPULATE_BASE_URL: http://localhost:18080
      E2E_BASE_URL: http://localhost:18080
      CI_ADMIN_EMAIL: ci-admin@example.local
      CI_ADMIN_PASSWORD: change-me
      CI_VIEWER_EMAIL: ci-viewer@example.local
      CI_VIEWER_PASSWORD: change-me
      IDENTITY_SEED_TOTP_SECRET: CAATLASMFASEED22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: full-stack-service-jars
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: apps/gateway-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify transferred service artifacts
        run: |
          set -euo pipefail
          tar -xf full-stack-service-jars.tar
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service ingestion-service document-service; do
            test -s "services/${service}/build/libs/app.jar"
          done
      - name: Start production stack
        run: |
          docker compose --env-file env/ci.env.example up -d --build edge-proxy mailpit
          for attempt in $(seq 1 90); do
            ready=true
            for service in catalog content amendment identity ingestion search document; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:18080/api/${service}/actuator/health" || true)
              if [ "$status" != 200 ]; then ready=false; break; fi
            done
            if [ "$ready" = true ] && curl --fail --silent http://127.0.0.1:18080/about >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file env/ci.env.example ps
          exit 1
      - name: Verify fresh deployment setup before fixtures
        working-directory: apps/gateway-web
        run: E2E_SETUP_FRESH=true npx playwright test --config=playwright.full.config.js setup-bootstrap.spec.ts
      - name: Generate, upload, and verify API fixtures
        working-directory: apps/gateway-web
        run: |
          npm run fixtures:generate
          npm run prepopulate
          cp e2e/fixtures/generated/.runtime/prepopulate-ids.json /tmp/prepopulate-first-ids.json
          npm run prepopulate
          cmp /tmp/prepopulate-first-ids.json e2e/fixtures/generated/.runtime/prepopulate-ids.json
          npm run prepopulate -- --verify-only
      - name: Checkpoint fixture journals for a fresh runner
        id: fixture-checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-seed-journal-roundtrip
          path: apps/gateway-web/e2e/fixtures/generated/.runtime/scenario-journal-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Remove the local journal before restoring its artifact
        working-directory: apps/gateway-web
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-state-before"
          mv e2e/fixtures/generated/.runtime/scenario-journal-*.json "$RUNNER_TEMP/fixture-state-before/"
      - name: Restore fixture journals from their artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.fixture-checkpoint.outputs.artifact-id }}
          merge-multiple: true
          path: apps/gateway-web/e2e/fixtures/generated/.runtime
      - name: Verify restored fixture journals and API state
        working-directory: apps/gateway-web
        run: |
          for saved in "$RUNNER_TEMP/fixture-state-before"/scenario-journal-*.json; do
            cmp "$saved" "e2e/fixtures/generated/.runtime/$(basename "$saved")"
          done
          npm run prepopulate -- --verify-only
      - name: Full-stack browser journeys
        working-directory: apps/gateway-web
        run: npm run test:e2e:full
      - name: Upload fixture exploration guide and acceptance views
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-scenarios
          path: |
            apps/gateway-web/e2e/fixtures/generated/.runtime/scenario-guide.md
            apps/gateway-web/e2e/fixtures/generated/.runtime/scenario-index.json
            apps/gateway-web/test-results/**/fixture-irregular-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Upload migration coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-migration-coverage
          path: |
            apps/gateway-web/test-results/**/legacy-migration-coverage.json
            apps/gateway-web/test-results/**/regional-reader-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Verify documentation journeys without capturing media
        working-directory: apps/gateway-web
        env:
          WIKI_MEDIA_CAPTURE: verify
        run: ./node_modules/.bin/playwright test --config=playwright.wiki-recording.config.js
      - name: Verify optional scale fixtures after browser journeys
        working-directory: apps/gateway-web
        run: |
          npm run prepopulate -- --profile scale
          npm run prepopulate -- --profile scale --verify-only
      - name: Verify disposable full-stack backup recovery
        env:
          PREPOPULATE_PROFILE: scale
        run: |
          python3 -m venv "$RUNNER_TEMP/recovery-coverage"
          "$RUNNER_TEMP/recovery-coverage/bin/pip" install coverage==7.17.0
          "$RUNNER_TEMP/recovery-coverage/bin/python" -m coverage run --parallel-mode scripts/operations/recovery_drill.py \
            --project full-stack-e2e --confirm-disposable full-stack-e2e \
            --base-url "$PREPOPULATE_BASE_URL" --report test-results/recovery-report.json
      - name: Upload recovery execution coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-recovery-execution
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-report
          path: test-results/recovery-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify local HTTPS authentication and deployment persistence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            docker compose --env-file env/ci.env.example exec -T identity-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT md5(string_agg(id::text || password_hash, chr(10) ORDER BY id)) FROM users; SELECT json_build_array(completed_at, bootstrap_admin_id, mail_deferred, access_reviewed, enabled_languages, default_language) FROM deployment_setup;"'
          }
          snapshot > /tmp/setup-before-https.txt
          TLS_MODE=local-https PUBLIC_BASE_URL=https://localhost:18443 NEXT_PUBLIC_BASE_URL=https://localhost:18443 SESSION_COOKIE_SECURE=true CADDY_HTTPS_PORT=18443 \
            docker compose --env-file env/ci.env.example up -d --no-deps --force-recreate edge-proxy gateway-web identity-service
          for attempt in $(seq 1 90); do
            if docker compose --env-file env/ci.env.example exec -T edge-proxy cat /data/caddy/pki/authorities/local/root.crt > /tmp/atlas-local-root.crt 2>/dev/null && \
              curl --fail --silent --cacert /tmp/atlas-local-root.crt https://localhost:18443/api/identity/setup/status > /tmp/https-setup.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("/tmp/https-setup.json"))["completed"] is True'
          snapshot > /tmp/setup-after-https.txt
          cmp /tmp/setup-before-https.txt /tmp/setup-after-https.txt
          E2E_TLS_CERT_SPKI="$(openssl s_client -connect localhost:18443 -servername localhost -CAfile /tmp/atlas-local-root.crt -verify_return_error -verify_hostname localhost </dev/null 2>/dev/null | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)"
          export E2E_TLS_CERT_SPKI
          cd apps/gateway-web
          E2E_TLS_SMOKE=true E2E_BASE_URL=https://localhost:18443 E2E_HTTP_BASE_URL=http://127.0.0.1:18080 \
            npx playwright test --config=playwright.full.config.js setup-https.spec.ts
      - name: Stack logs
        if: failure()
        run: docker compose --env-file env/ci.env.example logs --no-color --tail=200 > full-stack-logs.txt
      - name: Upload failed full-stack diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-stack-e2e-diagnostics
          path: |
            full-stack-logs.txt
            apps/gateway-web/test-results/**/error-context.md
            apps/gateway-web/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose --env-file env/ci.env.example down -v

  python-coverage:
    if: always()
    needs: [full-stack-e2e, publish-journey, gateway-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python coverage tools
        run: |
          python3 -m venv "$RUNNER_TEMP/python-coverage"
          echo "$RUNNER_TEMP/python-coverage/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python-coverage/bin/pip" install coverage==7.17.0 PyYAML==6.0.2
      - name: Exercise Python tooling with coverage
        run: python -m coverage run --parallel-mode scripts/code_coverage/run_python.py
      - name: Include real recovery execution in Python coverage
        if: needs.full-stack-e2e.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-recovery-execution
          path: .
      - name: Include real publication execution in Python coverage
        if: needs.publish-journey.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-publication-execution
          path: .
      - name: Include real transport execution in Python coverage
        if: needs.gateway-image.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-transport-execution
          path: .
      - name: Combine and bundle Python coverage
        if: always()
        run: |
          python -m coverage combine
          python -m coverage json
          python scripts/code_coverage/coverage_report.py pack python --format python --report coverage/python.json
      - name: Upload Python coverage input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: coverage-input-python
          path: coverage/inputs/
          if-no-files-found: error
          retention-days: 14

  coverage:
    if: always()
    needs: [backend-services, backend, platform, frontend, mcp-server, python-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Download this run's coverage inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-input-*
          path: coverage/inputs
          merge-multiple: true
      - name: Validate complete, commit-bound coverage inputs
        run: python3 scripts/code_coverage/coverage_report.py validate
      - name: Merge JVM probes and report every production class once
        run: |
          set -euo pipefail
          ./gradlew repositoryCoverage 2>&1 | tee coverage/jvm-report.log
          if grep -E 'does not match|do not match' coverage/jvm-report.log; then exit 1; fi
      - name: Report coverage and enforce overall, component and new-code minimums
        if: always()
        run: python3 scripts/code_coverage/coverage_report.py report --event "$GITHUB_EVENT_PATH" --minimum 80 --policy scripts/code_coverage/minimums.json
      - name: Upload code coverage statistics and browsable reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: code-coverage
          path: |
            coverage/summary.json
            coverage/summary.md
            coverage/source-lines.json
            coverage/index.html
            coverage/jvm.xml
            coverage/jvm-html/
            coverage/jvm-report.log
          if-no-files-found: error
          retention-days: 30

  ci-status:
    if: always()
    needs:
      - coverage
      - python-coverage
      - backend-services
      - backend
      - platform
      - frontend
      - e2e
      - visual-e2e
      - images
      - gateway-image
      - mcp-server
      - publish-journey
      - full-stack-service-artifacts
      - full-stack-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'
