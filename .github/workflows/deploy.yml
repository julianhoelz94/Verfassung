name: Deploy
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        default: test
        options:
          - test
          - prod
      prepopulate:
        description: Upload and publish generated fixture content after deployment (requires completed site setup and admin credentials)
        type: boolean
        required: false
        default: false
      prepopulate_profile:
        description: Fixture set to upload when prepopulate is enabled
        type: choice
        required: false
        default: compact
        options:
          - compact
          - extended
          - scale

permissions:
  contents: read

# Both environments share a server. Do not interrupt or overlap rollouts.
concurrency:
  group: constitution-atlas-coolify-deployment
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      source-sha: ${{ steps.release.outputs.source-sha }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      image-matrix: ${{ steps.images.outputs.matrix }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an administrator and a published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: python3 scripts/cd/check_request.py
      - name: Wait for existing CI compilation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source-sha }}
        run: python3 scripts/cd/check_ci.py --source-sha "$SOURCE_SHA" --timeout-seconds 2700 --poll-seconds 30
      - name: Discover release image packages
        id: images
        run: echo "matrix=$(python3 scripts/cd/release.py --matrix)" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build ${{ matrix.service }}
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.authorize.outputs.image-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.gradle
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.gradle
      - name: Authenticate this runner to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Compile one native AMD64 image without rerunning tests and capture its digest
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_SERVICE: ${{ matrix.service }}
        run: |
          python3 scripts/cd/build_images.py --repository "$GITHUB_REPOSITORY" \
            --environment "$DEPLOYMENT_ENVIRONMENT" --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --service "$IMAGE_SERVICE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-image-${{ matrix.service }}
          path: .image/image.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  candidate-images:
    needs: [authorize, build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-image-*
          path: .image-artifacts
          merge-multiple: false
      - name: Require every image from this workflow run, source revision and environment
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
        run: |
          python3 scripts/cd/collect_images.py --repository "$GITHUB_REPOSITORY" \
            --environment "$DEPLOYMENT_ENVIRONMENT" --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" \
            --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  deploy:
    needs: [authorize, candidate-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'prod' && 'https://verfassungen.julianhoelz.de' || 'https://tst.verfassungen.julianhoelz.de' }}
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      # Optional migration setting for an application created before CD bootstrap.
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      COOLIFY_CONFIG_TOKEN: ${{ secrets.COOLIFY_CONFIG_TOKEN }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: .release
      - name: Require deployment settings
        env:
          TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
          TS_TAGS: ${{ vars.TS_TAGS }}
          PREPOPULATE: ${{ inputs.prepopulate }}
          PREPOPULATE_PROFILE: ${{ inputs.prepopulate_profile || 'compact' }}
          PREPOPULATE_ADMIN_EMAIL: ${{ secrets.PREPOPULATE_ADMIN_EMAIL }}
          PREPOPULATE_ADMIN_PASSWORD: ${{ secrets.PREPOPULATE_ADMIN_PASSWORD }}
          PREPOPULATE_TOTP_SECRET: ${{ secrets.PREPOPULATE_TOTP_SECRET }}
        run: |
          for setting in COOLIFY_URL COOLIFY_PROJECT_UUID COOLIFY_SERVER_UUID PUBLIC_BASE_URL \
            COOLIFY_CONFIG_TOKEN COOLIFY_DEPLOY_TOKEN TS_CLIENT_ID TS_AUDIENCE TS_TAGS; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing environment setting: $setting"
              exit 1
            fi
          done
          python3 scripts/cd/prepopulate.py
      - name: Locate the selected environment's saved fixture journal
        id: fixture-state
        if: inputs.prepopulate && (inputs.prepopulate_profile || 'compact') != 'compact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cd/prepopulate.py --find-state
      - name: Restore the deployment fixture journal
        if: inputs.prepopulate && steps.fixture-state.outputs.state-found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.fixture-state.outputs.run-id }}
          artifact-ids: ${{ steps.fixture-state.outputs.artifact-id }}
          merge-multiple: true
          path: apps/gateway-web/e2e/fixtures/generated/.runtime
      - name: Join Tailscale with an ephemeral OIDC identity
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS }}
      - name: Deploy the compiled release through the private Coolify API
        run: |
          python3 scripts/cd/deploy.py --repository "$GITHUB_REPOSITORY" \
            --environment "$DEPLOYMENT_ENVIRONMENT" --source-sha "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.prepopulate
        with:
          node-version: '22'
      - name: Prepopulate the selected environment after successful deployment
        id: prepopulate
        if: inputs.prepopulate
        working-directory: apps/gateway-web
        env:
          PREPOPULATE_DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          PREPOPULATE_BASE_URL: ${{ inputs.environment == 'prod' && 'https://verfassungen.julianhoelz.de' || 'https://tst.verfassungen.julianhoelz.de' }}
          PREPOPULATE_PROFILE: ${{ inputs.prepopulate_profile || 'compact' }}
          PREPOPULATE_ADMIN_EMAIL: ${{ secrets.PREPOPULATE_ADMIN_EMAIL }}
          PREPOPULATE_ADMIN_PASSWORD: ${{ secrets.PREPOPULATE_ADMIN_PASSWORD }}
          PREPOPULATE_TOTP_SECRET: ${{ secrets.PREPOPULATE_TOTP_SECRET }}
        run: |
          npm run prepopulate -- --profile "$PREPOPULATE_PROFILE"
          npm run prepopulate -- --profile "$PREPOPULATE_PROFILE" --verify-only
      - name: Save the deployment fixture journal for retries
        if: always() && inputs.prepopulate && (inputs.prepopulate_profile || 'compact') != 'compact' && (steps.prepopulate.outcome == 'success' || steps.prepopulate.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepopulate-state-${{ inputs.environment }}
          path: apps/gateway-web/e2e/fixtures/generated/.runtime/scenario-journal-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
      - name: Upload fixture exploration links
        if: always() && inputs.prepopulate && (steps.prepopulate.outcome == 'success' || steps.prepopulate.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepopulate-guide-${{ inputs.environment }}
          path: |
            apps/gateway-web/e2e/fixtures/generated/.runtime/scenario-guide.md
            apps/gateway-web/e2e/fixtures/generated/.runtime/scenario-index.json
            apps/gateway-web/e2e/fixtures/generated/.runtime/prepopulate-ids.json
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
