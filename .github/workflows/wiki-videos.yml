name: Refresh wiki videos

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPOSE_PROJECT_NAME: wiki-videos
      CADDY_PORT: '18080'
      GATEWAY_PORT: '13000'
      SESSION_COOKIE_SECURE: 'false'
      PUBLIC_BASE_URL: http://127.0.0.1:18080
      PREPOPULATE_TEST_STACK: 'true'
      PREPOPULATE_BASE_URL: http://127.0.0.1:18080
      E2E_BASE_URL: http://127.0.0.1:18080
      WIKI_VIDEO_DIR: ${{ runner.temp }}/wiki-videos
      CI_ADMIN_EMAIL: ci-admin@example.local
      CI_ADMIN_PASSWORD: change-me
      CI_VIEWER_EMAIL: ci-viewer@example.local
      CI_VIEWER_PASSWORD: change-me
      IDENTITY_SEED_TOTP_SECRET: CAATLASMFASEED22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build full-stack service jars
        run: |
          set -euo pipefail
          for service in identity-service catalog-service content-service editor-service \
            audit-service amendment-service search-service ingestion-service; do
            ./gradlew --no-daemon -p "services/${service}" bootJar -x test
            test -s "services/${service}/build/libs/app.jar"
          done
      - name: Install browser dependencies
        working-directory: apps/gateway-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start full stack
        run: |
          docker compose --env-file env/ci.env.example up -d --build edge-proxy
          for attempt in $(seq 1 90); do
            ready=true
            for service in catalog content amendment identity ingestion search; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:18080/api/${service}/actuator/health" || true)
              if [ "$status" != 200 ]; then ready=false; break; fi
            done
            if [ "$ready" = true ] && curl --fail --silent http://127.0.0.1:18080/about >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file env/ci.env.example ps
          exit 1
      - name: Upload real API fixtures
        working-directory: apps/gateway-web
        run: |
          npm run prepopulate
          npm run prepopulate -- --verify-only
      - name: Record full-stack editorial journey
        working-directory: apps/gateway-web
        run: ./node_modules/.bin/playwright test --config=playwright.wiki-recording.config.js
      - name: Verify clips
        run: |
          test -s "$WIKI_VIDEO_DIR/editing-a-draft.webm"
          test -s "$WIKI_VIDEO_DIR/reviewing-a-draft.webm"
          test -s "$WIKI_VIDEO_DIR/publishing-a-revision.webm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-videos
          path: ${{ runner.temp }}/wiki-videos/*.webm
          if-no-files-found: error
          retention-days: 1
      - name: Stack logs
        if: failure()
        run: docker compose --env-file env/ci.env.example logs --no-color --tail=200 > wiki-stack-logs.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-video-diagnostics
          path: wiki-stack-logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose --env-file env/ci.env.example down -v

  publish:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wiki-videos
          path: docs/wiki/media
      - name: Publish pages and fresh clips to GitHub Wiki
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/wiki-askpass <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$WIKI_TOKEN" ;;
          esac
          SH
          chmod 700 /tmp/wiki-askpass
          export GIT_ASKPASS=/tmp/wiki-askpass GIT_TERMINAL_PROMPT=0
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          mkdir -p wiki/media
          cp docs/wiki/*.md wiki/
          cp docs/wiki/media/*.webm wiki/media/
          git -C wiki add -- '*.md' media/*.webm
          if git -C wiki diff --cached --quiet; then exit 0; fi
          git -C wiki -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Refresh wiki for merged PR #${{ github.event.pull_request.number }}"
          git -C wiki push origin HEAD
