# Only cognitive complexity is enabled. Other detekt rules are intentionally
# outside this check; formatting continues to be enforced by Spotless.
complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    # detekt reports scores >= threshold; 16 therefore permits a maximum of 15,
    # matching SonarJS's rule, which reports scores > its configured maximum.
    threshold: 16
