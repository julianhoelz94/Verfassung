# Generated by scripts/cd/render_compose.py; keep service wiring in docker-compose.yml.
services:
  edge-proxy:
    environment:
      PROFILE: production
      TLS_MODE: external-proxy
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS origin}
      TLS_TRUSTED_PROXIES: ${TLS_TRUSTED_PROXIES:?Set the actual Coolify proxy CIDRs}
      CADDY_BIND_ADDRESS: 0.0.0.0
      CADDY_EXPOSE_API_DOCS: 'false'
      ATLAS_LEGACY_HOST: ${ATLAS_LEGACY_HOST:-legacy.localhost}
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - gateway-web
    - mcp-server
    restart: unless-stopped
    image: ${ATLAS_IMAGE_EDGE_PROXY:?Select an image using the manual deployment workflow}
    expose:
    - '80'
  mcp-server:
    environment:
      PORT: '8080'
      CATALOG_API_URL: http://catalog-service:8080
      CONTENT_API_URL: http://content-service:8080
      SEARCH_API_URL: http://search-service:8080
      DEPLOYMENT_SETUP_GATE_ENABLED: 'true'
      IDENTITY_API_URL: http://identity-service:8080
      INGESTION_API_URL: http://ingestion-service:8080
      MCP_CURSOR_SECRET: ${MCP_CURSOR_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS origin}
    depends_on:
      catalog-service:
        condition: service_started
      content-service:
        condition: service_started
      search-service:
        condition: service_started
      identity-service:
        condition: service_started
      ingestion-service:
        condition: service_started
    restart: unless-stopped
    image: ${ATLAS_IMAGE_MCP_SERVER:?Select an image using the manual deployment workflow}
  gateway-web:
    environment:
      TLS_MODE: external-proxy
      NODE_ENV: production
      SESSION_COOKIE_SECURE: 'true'
      IDENTITY_SEED_MODE: 'off'
      CATALOG_API_URL: http://catalog-service:8080
      CONTENT_API_URL: http://content-service:8080
      DOCUMENT_API_URL: http://document-service:8080
      AMENDMENT_API_URL: http://amendment-service:8080
      DEPLOYMENT_SETUP_GATE_ENABLED: 'true'
      IDENTITY_API_URL: http://identity-service:8080
      EDITOR_API_URL: http://editor-service:8080
      SEARCH_API_URL: http://search-service:8080
      INGESTION_API_URL: http://ingestion-service:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS origin}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS origin}
    depends_on:
      catalog-service:
        condition: service_started
      content-service:
        condition: service_started
      amendment-service:
        condition: service_started
      document-service:
        condition: service_started
      identity-service:
        condition: service_started
      editor-service:
        condition: service_started
      search-service:
        condition: service_started
      ingestion-service:
        condition: service_started
    restart: unless-stopped
    image: ${ATLAS_IMAGE_GATEWAY_WEB:?Select an image using the manual deployment workflow}
  catalog-service:
    environment:
      ARCHIVE_LEGACY_HOSTS: ${ARCHIVE_LEGACY_HOSTS:-www.verfassungen.de,verfassungen.de,legacy.localhost}
      DOCUMENT_API_URL: http://document-service:8080
      SPRING_PROFILES_ACTIVE: production
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      DEPLOYMENT_SETUP_GATE_ENABLED: 'true'
      IDENTITY_API_URL: http://identity-service:8080
      CONTENT_API_URL: http://content-service:8080
      EDITOR_API_URL: http://editor-service:8080
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped
    image: ${ATLAS_IMAGE_CATALOG_SERVICE:?Select an image using the manual deployment workflow}
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf ''GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3;
        grep -q ''"status":"UP"'' <&3'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
  content-service:
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://content-db:5432/content_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      DEPLOYMENT_SETUP_GATE_ENABLED: 'true'
