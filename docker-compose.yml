services:
  edge-proxy:
    build: ./infra/caddy
    container_name: edge-proxy
    ports:
      - "${CADDY_PORT:-80}:80"
    depends_on:
      - gateway-web

  gateway-web:
    build: ./apps/gateway-web
    environment:
      - NODE_ENV=development
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - CATALOG_API_URL=http://catalog-service:8080
      - CONTENT_API_URL=http://content-service:8080
      - AMENDMENT_API_URL=http://amendment-service:8080
      - IDENTITY_API_URL=http://identity-service:8080
      - EDITOR_API_URL=http://editor-service:8080
      - SEARCH_API_URL=http://search-service:8080
    container_name: gateway-web
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      catalog-service:
        condition: service_started
      content-service:
        condition: service_started
      amendment-service:
        condition: service_started
      identity-service:
        condition: service_started
      editor-service:
        condition: service_started
      search-service:
        condition: service_started

  catalog-service:
    build: ./services/catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SPRING_DATASOURCE_URL=jdbc:postgresql://catalog-db:5432/catalog_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      catalog-db:
        condition: service_healthy

  content-service:
    build: ./services/content-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SPRING_DATASOURCE_URL=jdbc:postgresql://content-db:5432/content_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      content-db:
        condition: service_healthy

  amendment-service:
    build: ./services/amendment-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SPRING_DATASOURCE_URL=jdbc:postgresql://amendment-db:5432/amendment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      amendment-db:
        condition: service_healthy

  identity-service:
    build: ./services/identity-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://identity-db:5432/identity_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - LOCAL_EDITOR_EMAIL=${LOCAL_EDITOR_EMAIL:-local-editor@example.local}
      - LOCAL_EDITOR_PASSWORD=${LOCAL_EDITOR_PASSWORD:-change-me}
      - LOCAL_REVIEWER_EMAIL=${LOCAL_REVIEWER_EMAIL:-local-reviewer@example.local}
      - LOCAL_REVIEWER_PASSWORD=${LOCAL_REVIEWER_PASSWORD:-change-me}
      - LOCAL_PUBLISHER_EMAIL=${LOCAL_PUBLISHER_EMAIL:-local-publisher@example.local}
      - LOCAL_PUBLISHER_PASSWORD=${LOCAL_PUBLISHER_PASSWORD:-change-me}
      - LOCAL_ADMIN_EMAIL=${LOCAL_ADMIN_EMAIL:-local-admin@example.local}
      - LOCAL_ADMIN_PASSWORD=${LOCAL_ADMIN_PASSWORD:-change-me}
      - LOCAL_VIEWER_EMAIL=${LOCAL_VIEWER_EMAIL:-local-viewer@example.local}
      - LOCAL_VIEWER_PASSWORD=${LOCAL_VIEWER_PASSWORD:-change-me}
      - AUDIT_API_URL=http://audit-service:8080
      - CI_EDITOR_EMAIL=${CI_EDITOR_EMAIL:-}
      - CI_EDITOR_PASSWORD=${CI_EDITOR_PASSWORD:-}
      - CI_REVIEWER_EMAIL=${CI_REVIEWER_EMAIL:-}
      - CI_REVIEWER_PASSWORD=${CI_REVIEWER_PASSWORD:-}
      - CI_PUBLISHER_EMAIL=${CI_PUBLISHER_EMAIL:-}
      - CI_PUBLISHER_PASSWORD=${CI_PUBLISHER_PASSWORD:-}
      - CI_ADMIN_EMAIL=${CI_ADMIN_EMAIL:-}
      - CI_ADMIN_PASSWORD=${CI_ADMIN_PASSWORD:-}
      - CI_VIEWER_EMAIL=${CI_VIEWER_EMAIL:-}
      - CI_VIEWER_PASSWORD=${CI_VIEWER_PASSWORD:-}
      - TEST_EDITOR_EMAIL=${TEST_EDITOR_EMAIL:-}
      - TEST_EDITOR_PASSWORD=${TEST_EDITOR_PASSWORD:-}
      - TEST_REVIEWER_EMAIL=${TEST_REVIEWER_EMAIL:-}
      - TEST_REVIEWER_PASSWORD=${TEST_REVIEWER_PASSWORD:-}
      - TEST_PUBLISHER_EMAIL=${TEST_PUBLISHER_EMAIL:-}
      - TEST_PUBLISHER_PASSWORD=${TEST_PUBLISHER_PASSWORD:-}
      - TEST_ADMIN_EMAIL=${TEST_ADMIN_EMAIL:-}
      - TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD:-}
      - TEST_VIEWER_EMAIL=${TEST_VIEWER_EMAIL:-}
      - TEST_VIEWER_PASSWORD=${TEST_VIEWER_PASSWORD:-}
      - PROD_EDITOR_EMAIL=${PROD_EDITOR_EMAIL:-}
      - PROD_EDITOR_PASSWORD=${PROD_EDITOR_PASSWORD:-}
      - PROD_REVIEWER_EMAIL=${PROD_REVIEWER_EMAIL:-}
      - PROD_REVIEWER_PASSWORD=${PROD_REVIEWER_PASSWORD:-}
      - PROD_PUBLISHER_EMAIL=${PROD_PUBLISHER_EMAIL:-}
      - PROD_PUBLISHER_PASSWORD=${PROD_PUBLISHER_PASSWORD:-}
      - PROD_ADMIN_EMAIL=${PROD_ADMIN_EMAIL:-}
      - PROD_ADMIN_PASSWORD=${PROD_ADMIN_PASSWORD:-}
      - PROD_VIEWER_EMAIL=${PROD_VIEWER_EMAIL:-}
      - PROD_VIEWER_PASSWORD=${PROD_VIEWER_PASSWORD:-}
    depends_on:
      identity-db:
        condition: service_healthy
      audit-service:
        condition: service_started

  editor-service:
    build: ./services/editor-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://editor-db:5432/editor_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - IDENTITY_API_URL=http://identity-service:8080
      - AUDIT_API_URL=http://audit-service:8080
      - CONTENT_API_URL=http://content-service:8080
      - SEARCH_API_URL=http://search-service:8080
      - EDITOR_PUBLISH_PUBLIC=${EDITOR_PUBLISH_PUBLIC:-true}
    depends_on:
      editor-db:
        condition: service_healthy
      identity-service:
        condition: service_started
      audit-service:
        condition: service_started
      content-service:
        condition: service_started
      search-service:
        condition: service_started

  audit-service:
    build: ./services/audit-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SPRING_DATASOURCE_URL=jdbc:postgresql://audit-db:5432/audit_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      audit-db:
        condition: service_healthy

  ingestion-service:
    build: ./services/ingestion-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ingestion-db:5432/ingestion_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - CATALOG_API_URL=http://catalog-service:8080
      - CONTENT_API_URL=http://content-service:8080
    depends_on:
      ingestion-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      content-service:
        condition: service_started

  search-service:
    build: ./services/search-service
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-local-stack}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://search-db:5432/search_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - CATALOG_API_URL=http://catalog-service:8080
      - CONTENT_API_URL=http://content-service:8080
      - SEARCH_REINDEX_ON_STARTUP=true
    depends_on:
      search-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      content-service:
        condition: service_started

  backup-service:
    image: postgres:16
    container_name: backup-service
    command: ["sh", "/backup/backup.sh"]
    volumes:
      - ./infra/backup:/backup
      - ./backups:/backups
    environment:
      - PGPASSWORD=postgres
    depends_on:
      catalog-db:
        condition: service_healthy
      content-db:
        condition: service_healthy
      amendment-db:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      editor-db:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      ingestion-db:
        condition: service_healthy
      search-db:
        condition: service_healthy

  catalog-db:
    image: postgres:16
    environment: { POSTGRES_DB: catalog_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [catalog-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  content-db:
    image: postgres:16
    environment: { POSTGRES_DB: content_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [content-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  amendment-db:
    image: postgres:16
    environment: { POSTGRES_DB: amendment_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [amendment-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  identity-db:
    image: postgres:16
    environment: { POSTGRES_DB: identity_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [identity-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  editor-db:
    image: postgres:16
    environment: { POSTGRES_DB: editor_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [editor-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  audit-db:
    image: postgres:16
    environment: { POSTGRES_DB: audit_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [audit-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  ingestion-db:
    image: postgres:16
    environment: { POSTGRES_DB: ingestion_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [ingestion-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  search-db:
    image: postgres:16
    environment: { POSTGRES_DB: search_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [search-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  catalog-db-data:
  content-db-data:
  amendment-db-data:
  identity-db-data:
  editor-db-data:
  audit-db-data:
  ingestion-db-data:
  search-db-data:
