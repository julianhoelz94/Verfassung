spring:
  application:
    name: amendment-service
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: true
logging:
  level:
    root: INFO
identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost/api/identity}
content:
  api:
    url: ${CONTENT_API_URL:http://localhost/api/content}
# Callers: CatalogClientConfig. Unique catalog.api.url for amendment-service. User: "Work on Sprint 36"
catalog:
  api:
    url: ${CATALOG_API_URL:http://localhost/api/catalog}
