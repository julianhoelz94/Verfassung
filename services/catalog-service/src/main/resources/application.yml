spring:
  jackson:
    # Preserve persisted request hashes and existing null/coercion contracts on Jackson 3.
    use-jackson2-defaults: true
  application:
    name: catalog-service
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: true
logging:
  level:
    root: INFO
identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost/api/identity}

content:
  api:
    url: ${CONTENT_API_URL:http://localhost/api/content}
editor:
  api:
    url: ${EDITOR_API_URL:http://localhost/api/editor}

document:
  api:
    url: ${DOCUMENT_API_URL:http://localhost/api/document}
