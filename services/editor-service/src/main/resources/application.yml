spring:
  application:
    name: editor-service
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost/api/identity}
audit:
  api:
    url: ${AUDIT_API_URL:http://localhost/api/audit}
content:
  api:
    url: ${CONTENT_API_URL:http://localhost/api/content}
catalog:
  api:
    url: ${CATALOG_API_URL:http://localhost/api/catalog}
amendment:
  api:
    url: ${AMENDMENT_API_URL:http://localhost/api/amendment}
search:
  api:
    url: ${SEARCH_API_URL:http://localhost/api/search}
editor:
  downstream:
    bearer: ${EDITOR_SERVICE_TOKEN:}
  outbox:
    poll-ms: ${EDITOR_OUTBOX_POLL_MS:5000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: true
logging:
  level:
    root: INFO
