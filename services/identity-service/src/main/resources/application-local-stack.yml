identity:
  seed:
    mode: create-only
    editor-email: ${LOCAL_EDITOR_EMAIL:}
    editor-password: ${LOCAL_EDITOR_PASSWORD:}
    reviewer-email: ${LOCAL_REVIEWER_EMAIL:}
    reviewer-password: ${LOCAL_REVIEWER_PASSWORD:}
    publisher-email: ${LOCAL_PUBLISHER_EMAIL:}
    publisher-password: ${LOCAL_PUBLISHER_PASSWORD:}
    admin-email: ${LOCAL_ADMIN_EMAIL:}
    admin-password: ${LOCAL_ADMIN_PASSWORD:}
    viewer-email: ${LOCAL_VIEWER_EMAIL:}
    viewer-password: ${LOCAL_VIEWER_PASSWORD:}
  session:
    idle-timeout: 30m
    absolute-timeout: 24h
  password:
    log-reset-token: true
