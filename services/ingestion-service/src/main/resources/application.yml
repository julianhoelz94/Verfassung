spring:
  application:
    name: ingestion-service
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
catalog:
  api:
    url: ${CATALOG_API_URL:http://localhost/api/catalog}
content:
  api:
    url: ${CONTENT_API_URL:http://localhost/api/content}
identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost/api/identity}
audit:
  api:
    url: ${AUDIT_API_URL:http://localhost/api/audit}
search:
  api:
    url: ${SEARCH_API_URL:http://localhost/api/search}
ingestion:
  publish:
    token: ${INGESTION_PUBLISH_TOKEN:}
  audit:
    token: ${INGESTION_AUDIT_TOKEN:}
  search:
    token: ${INGESTION_SEARCH_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: true
logging:
  level:
    root: INFO
