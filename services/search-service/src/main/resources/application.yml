spring:
  jackson:
    # Preserve persisted request hashes and existing null/coercion contracts on Jackson 3.
    use-jackson2-defaults: true
  application:
    name: search-service
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
catalog:
  api:
    url: ${CATALOG_API_URL:http://localhost/api/catalog}
content:
  api:
    url: ${CONTENT_API_URL:http://localhost/api/content}
search:
  reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:false}
identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost/api/identity}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: true
logging:
  level:
    root: INFO
